<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Caja Tesorería</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --verde: #16a34a; --verde-bg: #dcfce7; --verde-tx: #14532d;
    --rojo: #dc2626; --rojo-bg: #fee2e2; --rojo-tx: #7f1d1d;
    --azul: #2563eb; --azul-bg: #dbeafe; --azul-tx: #1e3a8a;
    --gris: #6b7280; --borde: #d1d5db; --fondo: #f3f4f6; --card: #ffffff; --texto: #111827;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--fondo); color: var(--texto); padding-bottom: 40px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 17px; color: var(--gris); font-weight: 500; text-align: center; padding: 10px 0 2px; }
  /* la tarjeta del saldo queda fija arriba; solo se desplaza lo de abajo */
  .fijo { position: sticky; top: 0; z-index: 30; background: var(--fondo); margin: 0 -12px; padding: 0 12px; }
  .fijo .card { box-shadow: 0 2px 10px rgba(0,0,0,.13); }
  .saldo { text-align: center; position: relative; }
  #btnRefrescar { position: absolute; top: 8px; right: 8px; border: none; background: none; font-size: 24px; color: var(--gris); padding: 6px; }
  #btnRefrescar.girando { animation: g 1s linear infinite; }
  .saldo .fecha { font-size: 15px; color: var(--gris); }
  .saldo .monto { font-size: 36px; font-weight: 700; margin: 2px 0; }
  .saldo .usd { font-size: 16px; color: var(--gris); }
  label { display: block; font-size: 14px; color: var(--gris); margin: 12px 0 6px; }
  .fila { display: flex; gap: 8px; }
  .btn-tipo { flex: 1; padding: 14px 0; font-size: 18px; font-weight: 600; border-radius: 10px; border: 1.5px solid var(--borde); background: var(--card); color: var(--gris); }
  .btn-tipo.entrada.on { background: var(--verde-bg); border-color: var(--verde); color: var(--verde-tx); }
  .btn-tipo.salida.on { background: var(--rojo-bg); border-color: var(--rojo); color: var(--rojo-tx); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--borde); background: var(--card); font-size: 16px; color: var(--gris); }
  .chip.on { background: var(--azul-bg); border-color: var(--azul); color: var(--azul-tx); font-weight: 600; }
  input[type=text], input[type=tel], input[type=password] { width: 100%; padding: 13px; font-size: 18px; border: 1.5px solid var(--borde); border-radius: 10px; background: var(--card); color: var(--texto); }
  input:focus { outline: none; border-color: var(--azul); }
  #monto { font-size: 25px; font-weight: 600; }
  .sug { border: 1.5px solid var(--borde); border-radius: 10px; margin-top: 4px; overflow: hidden; background: var(--card); }
  .sug div { padding: 13px 14px; font-size: 17px; border-top: 1px solid #eee; display: flex; justify-content: space-between; }
  .sug div:first-child { border-top: none; }
  .sug small { color: var(--gris); font-size: 15px; }
  .confirmar { width: 100%; margin-top: 16px; padding: 16px 0; font-size: 19px; font-weight: 700; color: #fff; border: none; border-radius: 12px; background: var(--verde); }
  .confirmar.salida { background: var(--rojo); }
  .confirmar:disabled { opacity: .5; }
  .mov { display: flex; align-items: center; gap: 8px; padding: 11px 0; border-top: 1px solid #eee; font-size: 16px; }
  .mov:first-child { border-top: none; }
  .mov .que { flex: 1; }
  .mov .quien { font-size: 14px; color: var(--gris); }
  .mov .cuanto { font-weight: 600; white-space: nowrap; }
  .mov .cuanto.e { color: var(--verde); }
  .mov .cuanto.s { color: var(--rojo); }
  .mov button { border: none; background: none; color: var(--gris); font-size: 20px; padding: 4px 6px; }
  .aviso { text-align: center; font-size: 16px; color: var(--gris); padding: 8px 0; }
  .error { background: var(--rojo-bg); color: var(--rojo-tx); padding: 11px 14px; border-radius: 10px; font-size: 16px; margin-bottom: 10px; display: none; }
  .glory { background: var(--verde-bg); color: var(--verde-tx); border: 1.5px solid var(--verde); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 17px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .glory b { font-size: 21px; }
  .glory button { border: none; background: var(--verde); color: #fff; font-size: 16px; font-weight: 600; padding: 10px 16px; border-radius: 8px; white-space: nowrap; }
  .glory.alerta { background: #fef3c7; color: #78350f; border-color: #f59e0b; }
  .glory.alerta button { background: #b45309; }
  .oculto { display: none !important; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: g .7s linear infinite; vertical-align: -3px; }
  @keyframes g { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #111827; --card: #1f2937; --texto: #f9fafb; --borde: #374151; --gris: #9ca3af;
      --verde-bg: #14532d; --verde-tx: #bbf7d0; --rojo-bg: #7f1d1d; --rojo-tx: #fecaca; --azul-bg: #1e3a8a; --azul-tx: #bfdbfe; }
    .mov { border-top-color: #374151; }
    .sug div { border-top-color: #374151; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Caja tesorería</h1>
  <div class="error" id="error"></div>

  <div class="card" id="login">
    <label>Ingresá tu clave de acceso</label>
    <input type="password" id="clave" autocomplete="off" placeholder="Clave">
    <button class="confirmar" id="entrar" style="margin-top:12px">Entrar</button>
  </div>

  <!-- Pausa por inactividad: mientras está visible, la app NO le pregunta nada
       al servidor. Sirve para que un celular abierto y olvidado no siga
       consumiendo la cuota de Google. -->
  <div class="card oculto" id="pausa" style="text-align:center">
    <div style="font-size:40px;margin-bottom:8px">😴</div>
    <label style="font-size:16px">La app se pausó sola porque no se usó por un rato.</label>
    <p style="color:var(--gris);font-size:14px;margin:8px 0 14px">
      En pausa no le consume nada al servidor.
    </p>
    <button class="confirmar" id="btnSeguir">Continuar</button>
  </div>

  <div id="app" class="oculto">
    <div class="fijo">
    <div class="card saldo">
      <button id="btnRefrescar" title="Actualizar">⟳</button>
      <div class="fecha" id="fecha"></div>
      <div style="font-size:15px;color:var(--gris)">Saldo en efectivo</div>
      <div class="monto" id="saldo">—</div>
      <div class="usd" id="saldoUsd"></div>
    </div>
    </div>

    <div class="card">
      <div class="fila">
        <button class="btn-tipo entrada" id="btnE">↓ Ingreso</button>
        <button class="btn-tipo salida" id="btnS">↑ Egreso</button>
      </div>

      <label>Empresa (podés tocar más de una)</label>
      <div class="chips" id="empresas"></div>

      <label>Moneda</label>
      <div class="chips" id="monedas">
        <button class="chip on" data-m="ARS">Pesos</button>
        <button class="chip" data-m="USD">Dólares</button>
      </div>

      <label>Detalle</label>
      <input type="text" id="detalle" autocomplete="off" placeholder="Escribí y elegí de la lista">
      <div class="sug oculto" id="sug"></div>

      <label>Monto</label>
      <div id="glory" class="glory oculto"></div>
      <input type="tel" id="monto" inputmode="numeric" placeholder="$ 0">

      <button class="confirmar" id="confirmar">Confirmar ingreso</button>
    </div>

    <div class="card">
      <label style="margin-top:0">Movimientos de hoy</label>
      <div id="movs" class="aviso">Cargando…</div>
    </div>
  </div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxL_UQ0p1e0QDZ1PGgz5G71aMgfl9iLcf32lR_KU7bzOvNh4KyLVGnDLF30HFzkr7j5wg/exec';
var EMPRESAS = ['LP', 'PPP', 'ELEBES', 'EL CHIRLO', 'SIN'];
var estado = { tipo: 'E', moneda: 'ARS', emp: [], atajos: [], enviando: false };

function $(id) { return document.getElementById(id); }
/* evita que un detalle con caracteres raros rompa (o altere) la pantalla */
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmt(n) { return new Intl.NumberFormat('es-AR').format(Math.round(n)); }
function fmtMon(n, m) { return (m === 'USD' ? 'US$ ' : '$ ') + fmt(n); }

function mostrarError(msg) {
  var e = $('error');
  e.textContent = msg;
  e.style.display = 'block';
  setTimeout(function () { e.style.display = 'none'; }, 6000);
}

function api(cuerpo) {
  cuerpo.clave = localStorage.getItem('clave') || $('clave').value.trim();
  // corte por tiempo: si el servidor no responde, no dejamos la app colgada
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var corte = ctrl ? setTimeout(function () { ctrl.abort(); }, 25000) : null;
  var opciones = { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(cuerpo) };
  if (ctrl) opciones.signal = ctrl.signal;
  return fetch(API_URL, opciones)
    .then(function (r) {
      if (corte) clearTimeout(corte);
      return r.text().then(function (txt) {
        try { return JSON.parse(txt); }
        catch (e) { throw new Error('El servidor no respondió bien. Reintentá en un momento.'); }
      });
    })
    .then(function (d) { if (d.error) throw new Error(d.error); return d; })
    .catch(function (e) {
      if (corte) clearTimeout(corte);
      if (e.name === 'AbortError') throw new Error('El servidor tardó demasiado. Verificá si el movimiento se guardó antes de reintentar.');
      throw e;
    });
}
/* identificador único por confirmación (evita cargar dos veces si hay que reintentar) */
function nuevoId() {
  return 'C' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---- login ---- */
$('entrar').onclick = function () {
  var c = $('clave').value.trim();
  if (!c) return;
  $('entrar').innerHTML = '<span class="spin"></span>';
  api({ accion: 'estado' }).then(function (d) {
    localStorage.setItem('clave', c);
    iniciar(d);
  }).catch(function (e) {
    $('entrar').textContent = 'Entrar';
    mostrarError(e.message);
  });
};

function iniciar(d) {
  $('login').classList.add('oculto');
  $('app').classList.remove('oculto');
  pintarEstado(d);
}

/* ---- UI principal ---- */
function pintarEstado(d) {
  ultimaAct = Date.now();
  estado.atajos = d.atajos || [];
  mostrarConteoGlory(d.conteo);
  var hoy = new Date();
  var dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  // el día lo manda el servidor (la planilla), no el reloj del celular
  var diaMostrar = d.dia || hoy.getDate();
  var aviso = (d.dia && d.dia !== hoy.getDate()) ? ' ⚠️' : '';
  $('fecha').textContent = dias[hoy.getDay()] + ' ' + diaMostrar + ' de ' + meses[hoy.getMonth()] + aviso + ' · ' + d.usuario;
  $('saldo').textContent = '$ ' + fmt(d.saldo);
  $('saldo').style.opacity = d.saldoDudoso ? '0.55' : '1';
  $('saldoUsd').textContent = d.saldoDudoso
    ? '⚠️ Revisá el saldo anterior en la planilla'
    : (d.saldoUsd ? 'Dólares: US$ ' + fmt(d.saldoUsd) : '');
  var m = $('movs');
  if (!d.movimientos || !d.movimientos.length) { m.className = 'aviso'; m.textContent = 'Todavía no hay movimientos hoy.'; return; }
  m.className = ''; m.innerHTML = '';
  d.movimientos.forEach(function (mv) {
    var div = document.createElement('div');
    div.className = 'mov';
    var signo = mv.tipo === 'E' ? '+' : '−';
    div.innerHTML = '<div class="que">' + esc(mv.detalle) + (mv.empresas ? ' · ' + esc(mv.empresas) : '') +
      '<div class="quien">' + esc(mv.hora) + ' · ' + esc(mv.usuario) + '</div></div>' +
      '<div class="cuanto ' + (mv.tipo === 'E' ? 'e' : 's') + '">' + signo + ' ' + fmtMon(mv.monto, mv.moneda) + '</div>';
    var b = document.createElement('button');
    b.textContent = '✕';
    b.title = 'Anular';
    b.onclick = function () {
      if (!confirm('¿Anular este movimiento?\n' + mv.detalle + ' ' + fmtMon(mv.monto, mv.moneda))) return;
      api({ accion: 'anular', id: mv.id }).then(refrescar).catch(function (e) { mostrarError(e.message); });
    };
    div.appendChild(b);
    m.appendChild(div);
  });
}

function refrescar() {
  return api({ accion: 'estado' }).then(pintarEstado).catch(function (e) { mostrarError(e.message); });
}

/* ---- conteo de la contadora Glory ---- */
var conteoUsado = localStorage.getItem('conteoUsado') || '';
function mostrarConteoGlory(c) {
  var caja = $('glory');
  // clave por sesión + monto: si agregás un billete, el monto cambia y se vuelve a mostrar
  var clave = c ? (c.sesion + ':' + c.valor) : '';
  if (!c || !c.valor || clave === conteoUsado) { caja.classList.add('oculto'); return; }
  caja.classList.toggle('alerta', !!c.alerta);
  var aviso = c.alerta
    ? '<br><small>⚠️ Hay billetes que no reconozco: VERIFICÁ el monto contra el ticket.</small>'
    : '';
  caja.innerHTML = '<span>💵 La contadora contó<br><b>$ ' + fmt(c.valor) + '</b> <small>(' + c.billetes + ' billetes)</small>' + aviso + '</span>';
  var b = document.createElement('button');
  b.textContent = 'Usar';
  b.onclick = function () {
    estado.moneda = 'ARS';
    [].forEach.call($('monedas').children, function (x) { x.classList.toggle('on', x.dataset.m === 'ARS'); });
    $('monto').value = '$ ' + fmt(c.valor);
    conteoUsado = clave;
    try { localStorage.setItem('conteoUsado', clave); } catch (e) {}
    caja.classList.add('oculto');
  };
  caja.appendChild(b);
  caja.classList.remove('oculto');
}

/* tipo */
function pintarTipo() {
  $('btnE').classList.toggle('on', estado.tipo === 'E');
  $('btnS').classList.toggle('on', estado.tipo === 'S');
  var c = $('confirmar');
  c.classList.toggle('salida', estado.tipo === 'S');
  c.textContent = estado.tipo === 'E' ? 'Confirmar ingreso' : 'Confirmar egreso';
}
$('btnE').onclick = function () { estado.tipo = 'E'; pintarTipo(); };
$('btnS').onclick = function () { estado.tipo = 'S'; pintarTipo(); };

/* empresas */
EMPRESAS.forEach(function (e) {
  var b = document.createElement('button');
  b.className = 'chip'; b.textContent = e === 'SIN' ? 'Sin empresa' : e; b.dataset.e = e;
  b.onclick = function () {
    if (e === 'SIN') { estado.emp = estado.emp.indexOf('SIN') >= 0 ? [] : ['SIN']; }
    else {
      var i = estado.emp.indexOf(e);
      if (i >= 0) estado.emp.splice(i, 1); else estado.emp.push(e);
      estado.emp = estado.emp.filter(function (x) { return x !== 'SIN'; });
    }
    pintarEmp();
  };
  $('empresas').appendChild(b);
});
function pintarEmp() {
  [].forEach.call($('empresas').children, function (b) {
    b.classList.toggle('on', estado.emp.indexOf(b.dataset.e) >= 0);
  });
}
function setEmpDesdeTexto(txt) {
  estado.emp = [];
  if (!txt) { pintarEmp(); return; }
  EMPRESAS.forEach(function (e) { if (e !== 'SIN' && txt.toUpperCase().indexOf(e) >= 0) estado.emp.push(e); });
  pintarEmp();
}

/* moneda */
[].forEach.call($('monedas').children, function (b) {
  b.onclick = function () {
    estado.moneda = b.dataset.m;
    [].forEach.call($('monedas').children, function (x) { x.classList.toggle('on', x === b); });
    $('monto').placeholder = estado.moneda === 'USD' ? 'US$ 0' : '$ 0';
  };
});

/* autocompletado */
$('detalle').oninput = function () {
  var q = this.value.trim().toUpperCase();
  var caja = $('sug');
  if (q.length < 1) { caja.classList.add('oculto'); return; }
  var res = estado.atajos.filter(function (a) { return a.d.indexOf(q) >= 0; }).slice(0, 6);
  if (!res.length) { caja.classList.add('oculto'); return; }
  caja.innerHTML = '';
  res.forEach(function (a) {
    var div = document.createElement('div');
    div.innerHTML = '<span>' + esc(a.d) + '</span><small>' + esc(a.e || '') + '</small>';
    div.onclick = function () {
      $('detalle').value = a.d;
      caja.classList.add('oculto');
      if (a.t === 'E' || a.t === 'S') { estado.tipo = a.t; pintarTipo(); }
      setEmpDesdeTexto(a.e);
      $('monto').focus();
    };
    caja.appendChild(div);
  });
  caja.classList.remove('oculto');
};
document.addEventListener('click', function (ev) {
  if (ev.target.id !== 'detalle') $('sug').classList.add('oculto');
});

/* monto con puntos de miles */
$('monto').oninput = function () {
  var limpio = this.value.replace(/\D/g, '');
  this.value = limpio ? (estado.moneda === 'USD' ? 'US$ ' : '$ ') + fmt(Number(limpio)) : '';
};
function montoActual() { return Number($('monto').value.replace(/\D/g, '')); }

/* confirmar */
$('confirmar').onclick = function () {
  if (estado.enviando) return;
  var detalle = $('detalle').value.trim();
  var monto = montoActual();
  if (!detalle) { mostrarError('Escribí el detalle del movimiento.'); return; }
  if (!monto) { mostrarError('Poné el monto.'); return; }
  var empresas = estado.emp.filter(function (e) { return e !== 'SIN'; }).join(' ');
  var resumen = (estado.tipo === 'E' ? 'INGRESO' : 'EGRESO') + ' de ' + fmtMon(monto, estado.moneda) +
    '\n' + detalle + (empresas ? '\nEmpresa: ' + empresas : '\nSin empresa') + '\n\n¿Confirmás?';
  if (!confirm(resumen)) return;

  estado.enviando = true;
  var b = $('confirmar');
  b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  // el mismo id en los reintentos evita que se cargue la plata dos veces
  if (!estado.idPendiente) estado.idPendiente = nuevoId();
  api({ accion: 'agregar', tipo: estado.tipo, moneda: estado.moneda, monto: monto, detalle: detalle, empresas: empresas, idCliente: estado.idPendiente })
    .then(function () {
      estado.idPendiente = null;
      $('detalle').value = ''; $('monto').value = '';
      estado.emp = []; pintarEmp();
      return refrescar();
    })
    .catch(function (e) { mostrarError(e.message); })
    .then(function () {
      estado.enviando = false;
      b.disabled = false;
      pintarTipo();
    });
};

/* actualizar */
$('btnRefrescar').onclick = function () {
  var b = this;
  if (b.classList.contains('girando')) return;
  b.classList.add('girando');
  refrescar().then(function () { b.classList.remove('girando'); });
};
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && localStorage.getItem('clave') && !$('app').classList.contains('oculto')) refrescar();
});

/* ---- PAUSA POR INACTIVIDAD ----
   Un celular abierto y olvidado seguía preguntándole al servidor todo el día
   y se comía la cuota de Google. Ahora, a los 3 minutos sin que nadie toque
   nada, la app se pausa: deja de pedir CUALQUIER cosa al servidor.
   Y a los 30 minutos cierra la sesión del todo (pide la clave de nuevo).
   Se despausa sola al tocar la pantalla. */
var PAUSA_MS  = 180000;    // 3 minutos sin uso -> pausa
var CIERRE_MS = 1800000;   // 30 minutos sin uso -> cierra sesión
var pausado = false;

function estaPausado() { return pausado; }

function pausar() {
  if (pausado || $('app').classList.contains('oculto')) return;
  pausado = true;
  $('app').classList.add('oculto');
  $('pausa').classList.remove('oculto');
}

function despausar() {
  if (!pausado) return;
  pausado = false;
  $('pausa').classList.add('oculto');
  $('app').classList.remove('oculto');
  pausaConteo = 5000;
  pausaRefresco = 180000;
  refrescar();
}

function cerrarSesion() {
  localStorage.removeItem('clave');
  pausado = false;
  $('pausa').classList.add('oculto');
  $('app').classList.add('oculto');
  $('login').classList.remove('oculto');
  $('entrar').textContent = 'Entrar';
  $('clave').value = '';
}

/* si la app quedó quieta y la vuelven a tocar, se actualiza sola */
var ultimaAct = Date.now();
var ultimoToque = Date.now();   // marca de actividad: la usa el ritmo del sondeo
function toqueDeUso() {
  ultimoToque = Date.now();
  if (pausado) return;   // despausar se hace con el botón, no con cualquier roce
  if ($('app').classList.contains('oculto') || estado.enviando) return;
  if (Date.now() - ultimaAct < 60000) return;
  ultimaAct = Date.now();
  refrescar();
}

$('btnSeguir').onclick = despausar;

/* reloj de inactividad: no habla con el servidor, solo mira el reloj */
setInterval(function () {
  if (!localStorage.getItem('clave')) return;
  var quieto = Date.now() - ultimoToque;
  if (quieto >= CIERRE_MS) { cerrarSesion(); return; }
  if (quieto >= PAUSA_MS) pausar();
}, 20000);
document.addEventListener('touchstart', toqueDeUso, { passive: true });
document.addEventListener('mousedown', toqueDeUso);
document.addEventListener('focusin', toqueDeUso);

/* SONDEO DEL CONTEO DE LA CONTADORA.
   OJO: antes esto era un setInterval fijo de 5s, que disparaba SIEMPRE aunque
   la respuesta anterior no hubiera llegado. Cuando el servidor de Google se
   ponía lento (o se sumaba un segundo usuario) los pedidos se apilaban unos
   encima de otros: más pedidos -> más cola -> más lento -> más pedidos.
   Se comía la cuota diaria y la app tiraba errores de servidor.
   Ahora el próximo pedido se agenda RECIÉN cuando terminó el anterior, y si
   falla se afloja el ritmo solo. NO volver a poner setInterval acá. */
var pausaConteo = 5000;
function ritmoConteo() {
  // rápido solo si alguien tocó la app hace poco; si quedó abierta y quieta, tranquilo
  return (Date.now() - ultimoToque < 180000) ? 5000 : 30000;
}
function cicloConteo() {
  // dormido (pantalla apagada, app pausada, sin login o enviando): NO se pregunta nada
  if (document.hidden || pausado || $('app').classList.contains('oculto') || estado.enviando) {
    setTimeout(cicloConteo, 15000);
    return;
  }
  api({ accion: 'conteoRapido' })
    .then(function (d) { mostrarConteoGlory(d.conteo); pausaConteo = ritmoConteo(); })
    .catch(function () { pausaConteo = Math.min(pausaConteo * 2, 60000); })
    .then(function () { setTimeout(cicloConteo, pausaConteo); });
}
setTimeout(cicloConteo, 5000);

/* refresco completo (saldo y movimientos): mismo criterio, sin apilar.
   Va por api() y no por refrescar() para no mostrar cartel de error en cada
   refresco de fondo (el usuario no pidió nada, no tiene que ver un error). */
var pausaRefresco = 180000;
function cicloRefresco() {
  if (document.hidden || pausado || $('app').classList.contains('oculto') || estado.enviando) {
    setTimeout(cicloRefresco, 60000);
    return;
  }
  api({ accion: 'estado' })
    .then(function (d) { pintarEstado(d); pausaRefresco = 180000; })
    .catch(function () { pausaRefresco = Math.min(pausaRefresco * 2, 900000); })
    .then(function () { setTimeout(cicloRefresco, pausaRefresco); });
}
setTimeout(cicloRefresco, 180000);

/* arranque */
pintarTipo();
if (localStorage.getItem('clave')) {
  $('login').classList.add('oculto');
  api({ accion: 'estado' })
    .then(function (d) { pintarEstado(d); $('app').classList.remove('oculto'); })
    .catch(function () { localStorage.removeItem('clave'); $('login').classList.remove('oculto'); });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
